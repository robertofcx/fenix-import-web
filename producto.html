<style>

  <script>
    const RUTA_PRODUCTOS = "productos.json";
    const URL_SITIO = "https://fenix-import-peru.onrender.com";
    const NUMERO_WHATSAPP = "51978821080";
    let catalogoCompleto = null;
    let productoActual = null;
    let fuse = null;

    // ---------- Estado de la galería/carrusel ----------
    let imagenesProductoActual = [];
    let indiceImagenActual = 0;

    document.getElementById("anio").textContent = new Date().getFullYear();

    const mensajeGenerico = "¡Hola Fenix Import Perú!\nMe gustaría más información sobre sus productos.";
    const urlWhatsAppGenerico = "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensajeGenerico);
    ["nav-whatsapp", "whatsapp-flotante"].forEach(id => { document.getElementById(id).href = urlWhatsAppGenerico; });

    // ---------- Tema oscuro / claro ----------
    const raiz = document.documentElement;
    function aplicarTema(tema) { raiz.setAttribute("data-tema", tema); localStorage.setItem("fenix-tema", tema); }
    aplicarTema(localStorage.getItem("fenix-tema") || "claro");
    document.getElementById("btn-tema").addEventListener("click", () => {
      aplicarTema(raiz.getAttribute("data-tema") === "claro" ? "oscuro" : "claro");
    });

    // ---------- Menú lateral ----------
    const drawer = document.getElementById("drawer");
    const fondoDrawer = document.getElementById("fondo-drawer");
    function abrirDrawer() { drawer.classList.add("abierto"); fondoDrawer.classList.add("abierto"); document.body.style.overflow = "hidden"; }
    function cerrarDrawer() { drawer.classList.remove("abierto"); fondoDrawer.classList.remove("abierto"); document.body.style.overflow = ""; }
    document.getElementById("btn-abrir-drawer").addEventListener("click", abrirDrawer);
    document.getElementById("btn-cerrar-drawer").addEventListener("click", cerrarDrawer);
    fondoDrawer.addEventListener("click", cerrarDrawer);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarDrawer(); });

    // ---------- Buscador del header (con resultados en vivo) ----------
    const elInputBusqueda = document.getElementById("input-buscador-header");
    const elResultadosBusqueda = document.getElementById("resultados-busqueda");
    const elFormBuscador = document.getElementById("form-buscador-header");

    let temporizadorBusqueda = null;
    let indiceResaltado = -1;
    let resultadosActuales = [];

    function urlProducto(sku) { return "producto.html?sku=" + encodeURIComponent(sku); }

    function renderizarResultados(productos, textoBuscado) {
      if (productos.length === 0) {
        elResultadosBusqueda.innerHTML = `<div class="resultado-estado">No encontramos productos para "${textoBuscado}"</div>`;
        elResultadosBusqueda.classList.add("abierto");
        return;
      }

      const filas = productos.map(p => {
        const precio = Number(String(p.precio).replace(/[^0-9.]/g, "")).toFixed(2);
        const imagenHtml = p.imagen
          ? `<img src="${p.imagen}" alt="${p.nombre}">`
          : `<span class="sin-foto">Sin foto</span>`;
        const ofertaHtml = p.oferta ? `<span class="resultado-badge-oferta">Oferta</span>` : "";

        return `
          <a class="resultado-item" href="${urlProducto(p.sku)}" data-sku="${p.sku}">
            <div class="resultado-img">${imagenHtml}</div>
            <div class="resultado-info">
              <p class="resultado-nombre">${p.nombre}</p>
              <div class="resultado-meta">
                <span class="resultado-precio">S/ ${precio}</span>
                <span class="resultado-categoria">${p.categoria || ""}</span>
                ${ofertaHtml}
              </div>
            </div>
          </a>
        `;
      }).join("");

      const verTodos = `<a class="resultado-ver-todos" href="catalogo.html?buscar=${encodeURIComponent(textoBuscado)}">Ver todos los resultados para "${textoBuscado}" →</a>`;

      elResultadosBusqueda.innerHTML = filas + verTodos;
      elResultadosBusqueda.classList.add("abierto");
    }

    function buscarEnVivo(texto) {
      if (!fuse) return;
      const resultados = fuse.search(texto).slice(0, 6).map(r => r.item);
      indiceResaltado = -1;
      renderizarResultados(resultados, texto);
    }

    function cerrarResultados() {
      elResultadosBusqueda.classList.remove("abierto");
      indiceResaltado = -1;
    }

    elInputBusqueda.addEventListener("input", () => {
      const texto = elInputBusqueda.value.trim();
      clearTimeout(temporizadorBusqueda);

      if (texto.length < 2) {
        cerrarResultados();
        return;
      }

      temporizadorBusqueda = setTimeout(() => buscarEnVivo(texto), 120);
    });

    elInputBusqueda.addEventListener("keydown", (evento) => {
      const items = elResultadosBusqueda.querySelectorAll(".resultado-item");
      if (items.length === 0) return;

      if (evento.key === "ArrowDown") {
        evento.preventDefault();
        indiceResaltado = Math.min(indiceResaltado + 1, items.length - 1);
      } else if (evento.key === "ArrowUp") {
        evento.preventDefault();
        indiceResaltado = Math.max(indiceResaltado - 1, 0);
      } else if (evento.key === "Enter" && indiceResaltado >= 0) {
        evento.preventDefault();
        window.location.href = items[indiceResaltado].getAttribute("href");
        return;
      } else {
        return;
      }

      items.forEach((item, i) => item.classList.toggle("resaltado", i === indiceResaltado));
      items[indiceResaltado].scrollIntoView({ block: "nearest" });
    });

    document.addEventListener("click", (evento) => {
      if (!evento.target.closest(".contenedor-buscador")) cerrarResultados();
    });

    document.addEventListener("keydown", (evento) => {
      if (evento.key === "Escape") cerrarResultados();
    });

    elFormBuscador.addEventListener("submit", (evento) => {
      evento.preventDefault();
      const valor = elInputBusqueda.value.trim();
      if (!valor) return;
      window.location.href = "catalogo.html?buscar=" + encodeURIComponent(valor);
    });

    // ---------- Drawer de categorías (usa los datos ya cargados) ----------
    function dibujarDrawerCategorias(categorias) {
      const elDrawerCategorias = document.getElementById("drawer-categorias");

      elDrawerCategorias.innerHTML = categorias.map((cat, indice) => {
        const tieneSubcategorias = cat.subcategorias && cat.subcategorias.length > 0;
        if (!tieneSubcategorias) {
          return `<a class="drawer-categoria-sola" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}"><span>${cat.nombre}</span><span class="cantidad">${cat.cantidad}</span></a>`;
        }
        const subHtml = cat.subcategorias.map(sub => `
          <a class="drawer-subcategoria" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}&subcategoria=${encodeURIComponent(sub.nombre)}">
            <span>${sub.nombre}</span><span class="n">${sub.cantidad}</span>
          </a>`).join("");
        return `
          <div class="drawer-item" id="drawer-item-${indice}">
            <button class="drawer-categoria-fila" data-indice="${indice}">
              <span>${cat.nombre}</span><span class="cantidad">${cat.cantidad}</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <div class="drawer-subcategorias">
              <a class="drawer-subcategoria" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}" style="font-weight:600; color:var(--texto);"><span>Ver todo en ${cat.nombre}</span></a>
              ${subHtml}
            </div>
          </div>`;
      }).join("");

      elDrawerCategorias.querySelectorAll(".drawer-categoria-fila").forEach(boton => {
        boton.addEventListener("click", () => {
          document.getElementById("drawer-item-" + boton.dataset.indice).classList.toggle("abierto");
        });
      });
    }

    // ---------- Galería / Carrusel de imágenes ----------
    function normalizarImagenes(producto) {
      if (producto.imagenes && producto.imagenes.length > 0) return producto.imagenes;
      if (producto.imagen) return [producto.imagen];
      return [];
    }

    function renderizarGaleria(imagenes) {
      imagenesProductoActual = imagenes;
      indiceImagenActual = 0;

      if (imagenes.length === 0) {
        return `<div class="producto-galeria"><div class="producto-img"><span class="sin-foto">Sin foto disponible</span></div></div>`;
      }

      const flechas = imagenes.length > 1 ? `
        <button class="galeria-flecha izq" onclick="cambiarImagen(-1)" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="galeria-flecha der" onclick="cambiarImagen(1)" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span class="galeria-contador" id="galeria-contador">1 / ${imagenes.length}</span>
      ` : "";

      const miniaturas = imagenes.length > 1 ? `
        <div class="galeria-miniaturas" id="galeria-miniaturas">
          ${imagenes.map((url, i) => `
            <div class="miniatura ${i === 0 ? 'activa' : ''}" data-indice="${i}" onclick="irAImagen(${i})">
              <img src="${url}" alt="Vista ${i + 1}" loading="lazy">
            </div>
          `).join("")}
        </div>
      ` : "";

      return `
        <div class="producto-galeria">
          <div class="producto-img" id="producto-img-principal">
            ${flechas}
            <button class="galeria-lupa" onclick="abrirLupa()" aria-label="Ampliar imagen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <img id="imagen-principal" src="${imagenes[0]}" alt="Imagen del producto">
          </div>
          ${miniaturas}
        </div>
      `;
    }

    function irAImagen(indice) {
      indiceImagenActual = indice;
      document.getElementById("imagen-principal").src = imagenesProductoActual[indice];
      const contador = document.getElementById("galeria-contador");
      if (contador) contador.textContent = `${indice + 1} / ${imagenesProductoActual.length}`;
      document.querySelectorAll(".miniatura").forEach((min, i) => min.classList.toggle("activa", i === indice));
      const modalAbierto = document.getElementById("modal-zoom-fondo").classList.contains("abierto");
      if (modalAbierto) {
        document.getElementById("modal-zoom-imagen").src = imagenesProductoActual[indice];
        actualizarContadorModal();
      }
    }

    function cambiarImagen(delta) {
      if (imagenesProductoActual.length === 0) return;
      let nuevo = indiceImagenActual + delta;
      if (nuevo < 0) nuevo = imagenesProductoActual.length - 1;
      if (nuevo >= imagenesProductoActual.length) nuevo = 0;
      irAImagen(nuevo);
    }

    function activarSwipeGaleria() {
      const contenedor = document.getElementById("producto-img-principal");
      if (!contenedor) return;
      let xInicio = 0;

      contenedor.addEventListener("touchstart", (e) => { xInicio = e.touches[0].clientX; }, { passive: true });
      contenedor.addEventListener("touchend", (e) => {
        const diferencia = e.changedTouches[0].clientX - xInicio;
        if (Math.abs(diferencia) < 40) return;
        cambiarImagen(diferencia > 0 ? -1 : 1);
      }, { passive: true });
    }

    // ---------- Modal de zoom (lupa) ----------
    function actualizarContadorModal() {
      const contador = document.getElementById("modal-zoom-contador");
      if (contador) contador.textContent = `${indiceImagenActual + 1} / ${imagenesProductoActual.length}`;
    }

    function abrirLupa() {
      if (imagenesProductoActual.length === 0) return;
      document.getElementById("modal-zoom-imagen").src = imagenesProductoActual[indiceImagenActual];
      actualizarContadorModal();
      document.getElementById("modal-zoom-fondo").classList.add("abierto");
      document.body.style.overflow = "hidden";
    }

    function cerrarLupa() {
      document.getElementById("modal-zoom-fondo").classList.remove("abierto");
      document.body.style.overflow = "";
    }

    function cambiarImagenModal(delta) {
      cambiarImagen(delta);
      document.getElementById("modal-zoom-imagen").src = imagenesProductoActual[indiceImagenActual];
      actualizarContadorModal();
    }

    document.addEventListener("keydown", (e) => {
      const modal = document.getElementById("modal-zoom-fondo");
      if (!modal.classList.contains("abierto")) return;
      if (e.key === "Escape") cerrarLupa();
      if (e.key === "ArrowLeft") cambiarImagenModal(-1);
      if (e.key === "ArrowRight") cambiarImagenModal(1);
    });

    // ---------- Mostrar el producto ----------
    function urlWhatsAppProducto(producto) {
      const precio = Number(String(producto.precio).replace(/[^0-9.]/g, "")).toFixed(2);
      const link = URL_SITIO + "/producto.html?sku=" + encodeURIComponent(producto.sku);
      const mensaje = `¡Hola, Fenix Import Perú!\nMe gustaría realizar el siguiente pedido:\n${producto.nombre}\nPrecio: S/ ${precio}\nSKU: ${producto.sku}\n${link}`;
      return "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensaje);
    }

    function mostrarError(mensaje) {
      document.getElementById("estado-carga").innerHTML = `
        <div class="icono">⚠️</div>
        <p class="titulo">${mensaje}</p>
        <a href="catalogo.html" style="color:var(--azul); font-weight:600;">Ver catálogo completo →</a>
      `;
    }

    function mostrarProducto(producto) {
      productoActual = producto;

      document.getElementById("titulo-pagina").textContent = producto.nombre + " — Fenix Import Perú";
      document.getElementById("meta-descripcion").setAttribute("content", producto.nombre);

      const elBreadcrumb = document.getElementById("breadcrumb");
      let breadcrumbHtml = `<a href="index.html">Inicio</a>`;
      if (producto.categoria) {
        breadcrumbHtml += ` <span class="sep">›</span> <a href="catalogo.html?categoria=${encodeURIComponent(producto.categoria)}">${producto.categoria}</a>`;
      }
      if (producto.subcategoria) {
        breadcrumbHtml += ` <span class="sep">›</span> <a href="catalogo.html?categoria=${encodeURIComponent(producto.categoria)}&subcategoria=${encodeURIComponent(producto.subcategoria)}">${producto.subcategoria}</a>`;
      }
      breadcrumbHtml += ` <span class="sep">›</span> <span class="actual">${producto.nombre}</span>`;
      elBreadcrumb.innerHTML = breadcrumbHtml;
      elBreadcrumb.style.display = "flex";

      const precio = Number(String(producto.precio).replace(/[^0-9.]/g, "")).toFixed(2);
      const imagenes = normalizarImagenes(producto);
      const galeriaHtml = renderizarGaleria(imagenes);
      const badge = producto.oferta ? `<span class="badge-oferta-producto">Oferta</span>` : "";

      const meta = [];
      if (producto.marca) meta.push(producto.marca);
      if (producto.color) meta.push(producto.color);
      meta.push("SKU " + producto.sku);

      const descripcionHtml = producto.descripcion
        ? `<div><p class="producto-seccion-titulo">Descripción</p><p class="producto-seccion-texto">${producto.descripcion}</p></div>`
        : "";
      const caracteristicasHtml = producto.caracteristicas
        ? `<div><p class="producto-seccion-titulo">Características</p><p class="producto-seccion-texto">${producto.caracteristicas}</p></div>`
        : "";
      const incluyeHtml = producto.incluye
        ? `<div><p class="producto-seccion-titulo">Incluye</p><p class="producto-seccion-texto">${producto.incluye}</p></div>`
        : "";

      document.getElementById("contenido-producto").innerHTML = `
        <div class="producto-layout">
          <div style="position:relative;">${badge}${galeriaHtml}</div>
          <div>
            <p class="producto-categoria">${producto.categoria || ""}${producto.subcategoria ? " · " + producto.subcategoria : ""}</p>
            <h1 class="producto-nombre">${producto.nombre}</h1>
            <p class="producto-precio">S/ ${precio}</p>
            <div class="producto-meta">${meta.map(m => `<span>${m}</span>`).join("")}</div>
            <button class="btn-agregar-carrito-producto" onclick="agregarAlCarritoActual()">
              + Agregar al pedido
            </button>
            <a class="btn-whatsapp-producto" href="${urlWhatsAppProducto(producto)}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.56-1.17-2.98s.74-2.11 1-2.4c.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.3.37-.43.5-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.31 2.35 1.45.29.15.46.13.63-.07.17-.2.72-.83.91-1.11.19-.29.38-.24.63-.14.26.1 1.63.77 1.91.91.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>
              Consultar por WhatsApp
            </a>
            <p class="nota-entrega">Coordinamos entrega en Lima y envíos a todo el Perú.</p>
          </div>
        </div>
        <div class="producto-secciones">
          ${descripcionHtml}
          ${caracteristicasHtml}
          ${incluyeHtml}
        </div>
      `;

      document.getElementById("estado-carga").style.display = "none";
      document.getElementById("contenido-producto").style.display = "block";

      activarSwipeGaleria();
      actualizarMetaTagsSEO(producto, precio);
      insertarDatosEstructurados(producto, precio, imagenes);
    }

    function actualizarMetaTagsSEO(producto, precio) {
      const url = "https://fenix-import-peru.onrender.com/producto.html?sku=" + encodeURIComponent(producto.sku);
      const descripcionCorta = (producto.descripcion || producto.nombre).slice(0, 160);
      const imagen = producto.imagen || "https://fenix-import-peru.onrender.com/logo.webp";

      document.getElementById("meta-descripcion").setAttribute("content", descripcionCorta);
      document.getElementById("link-canonical").setAttribute("href", url);
      document.getElementById("og-titulo").setAttribute("content", producto.nombre + " — Fenix Import Perú");
      document.getElementById("og-descripcion").setAttribute("content", descripcionCorta);
      document.getElementById("og-imagen").setAttribute("content", imagen);
      document.getElementById("og-url").setAttribute("content", url);
      document.getElementById("og-precio").setAttribute("content", precio);
    }

    function insertarDatosEstructurados(producto, precio, imagenes) {
      const url = "https://fenix-import-peru.onrender.com/producto.html?sku=" + encodeURIComponent(producto.sku);

      const productoLd = {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": producto.nombre,
        "sku": producto.sku,
        "image": imagenes.length > 0 ? imagenes : undefined,
        "description": producto.descripcion || producto.nombre,
        "brand": producto.marca ? { "@type": "Brand", "name": producto.marca } : undefined,
        "offers": {
          "@type": "Offer",
          "url": url,
          "priceCurrency": "PEN",
          "price": precio,
          "availability": "https://schema.org/InStock",
          "seller": { "@type": "Organization", "name": "Fenix Import Perú" }
        }
      };

      const breadcrumbLd = {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Inicio", "item": "https://fenix-import-peru.onrender.com/" },
          { "@type": "ListItem", "position": 2, "name": producto.categoria || "Catálogo", "item": "https://fenix-import-peru.onrender.com/catalogo.html" },
          { "@type": "ListItem", "position": 3, "name": producto.nombre, "item": url }
        ]
      };

      let contenedor = document.getElementById("ld-json-producto");
      if (!contenedor) {
        contenedor = document.createElement("script");
        contenedor.type = "application/ld+json";
        contenedor.id = "ld-json-producto";
        document.head.appendChild(contenedor);
      }
      contenedor.textContent = JSON.stringify([productoLd, breadcrumbLd]);
    }

    // ---------- Carga única: productos.json ----------
    async function iniciar() {
      const sku = new URLSearchParams(window.location.search).get("sku");

      if (!sku) {
        mostrarError("No se especificó qué producto mostrar.");
        return;
      }

      try {
        const respuesta = await fetch(RUTA_PRODUCTOS);
        if (!respuesta.ok) throw new Error("No se pudo cargar productos.json (" + respuesta.status + ")");

        catalogoCompleto = await respuesta.json();

        fuse = new Fuse(catalogoCompleto.productos, {
          keys: ["nombre", "sku"],
          threshold: 0.35,
          ignoreLocation: true
        });

        dibujarDrawerCategorias(catalogoCompleto.categorias || []);

        const producto = catalogoCompleto.productos.find(p => p.sku === sku);

        if (!producto) {
          mostrarError("No encontramos este producto. Puede que ya no esté disponible.");
          return;
        }

        mostrarProducto(producto);

      } catch (error) {
        mostrarError("Ocurrió un problema al cargar el producto. Intenta recargar la página.");
        console.error(error);
      }
    }

    // ========================================================================
    // CARRITO DE WHATSAPP
    // ========================================================================
    const CARRITO_KEY = "fenix_carrito";

    function obtenerCarrito() {
      try {
        return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function guardarCarrito(carrito) {
      localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
      actualizarBadgeCarrito();
    }

    function actualizarBadgeCarrito() {
      const carrito = obtenerCarrito();
      const totalItems = carrito.reduce((suma, item) => suma + item.cantidad, 0);
      const elBadge = document.getElementById("badge-carrito");
      if (totalItems > 0) {
        elBadge.textContent = totalItems;
        elBadge.style.display = "flex";
      } else {
        elBadge.style.display = "none";
      }
    }

    function mostrarToast(mensaje) {
      const elToast = document.getElementById("toast-carrito");
      elToast.textContent = mensaje;
      elToast.classList.add("visible");
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => elToast.classList.remove("visible"), 2200);
    }

    function agregarAlCarrito(producto, mostrarConfirmacion = true) {
      const carrito = obtenerCarrito();
      const existente = carrito.find(item => item.sku === producto.sku);

      if (existente) {
        existente.cantidad += 1;
      } else {
        carrito.push({ sku: producto.sku, nombre: producto.nombre, precio: producto.precio, imagen: producto.imagen, cantidad: 1 });
      }

      guardarCarrito(carrito);
      if (mostrarConfirmacion) mostrarToast("✓ Agregado a tu pedido");
    }

    function agregarAlCarritoActual() {
      if (productoActual) agregarAlCarrito(productoActual);
    }

    function quitarDelCarrito(sku) {
      const carrito = obtenerCarrito().filter(item => item.sku !== sku);
      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function cambiarCantidad(sku, delta) {
      const carrito = obtenerCarrito();
      const item = carrito.find(i => i.sku === sku);
      if (!item) return;

      item.cantidad += delta;
      if (item.cantidad <= 0) {
        quitarDelCarrito(sku);
        return;
      }

      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function extraerPrecioNumerico(precio) {
      return Number(String(precio).replace(/[^0-9.]/g, "")) || 0;
    }

    function renderizarCarrito() {
      const carrito = obtenerCarrito();
      const elLista = document.getElementById("carrito-lista");
      const elFooter = document.getElementById("carrito-footer");

      if (carrito.length === 0) {
        elLista.innerHTML = `<div class="carrito-vacio">Tu pedido está vacío.<br>Agrega productos desde el catálogo.</div>`;
        elFooter.style.display = "none";
        return;
      }

      elFooter.style.display = "block";

      elLista.innerHTML = carrito.map(item => {
        const precioUnit = extraerPrecioNumerico(item.precio);
        const imagenHtml = item.imagen
          ? `<img src="${item.imagen}" alt="${item.nombre}">`
          : "";

        return `
          <div class="carrito-item">
            <div class="carrito-item-img">${imagenHtml}</div>
            <div class="carrito-item-info">
              <p class="carrito-item-nombre">${item.nombre}</p>
              <p class="carrito-item-precio">S/ ${precioUnit.toFixed(2)} c/u</p>
              <div class="carrito-item-controles">
                <button onclick="cambiarCantidad('${item.sku}', -1)" aria-label="Quitar uno">−</button>
                <span class="carrito-item-cantidad">${item.cantidad}</span>
                <button onclick="cambiarCantidad('${item.sku}', 1)" aria-label="Agregar uno">+</button>
                <button class="carrito-item-quitar" onclick="quitarDelCarrito('${item.sku}')">Quitar</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      const total = carrito.reduce((suma, item) => suma + extraerPrecioNumerico(item.precio) * item.cantidad, 0);
      document.getElementById("carrito-total-monto").textContent = "S/ " + total.toFixed(2);
    }

    function abrirCarrito() {
      renderizarCarrito();
      document.getElementById("drawer-carrito").classList.add("abierto");
      document.getElementById("fondo-carrito").classList.add("abierto");
      document.body.style.overflow = "hidden";
    }

    function cerrarCarrito() {
      document.getElementById("drawer-carrito").classList.remove("abierto");
      document.getElementById("fondo-carrito").classList.remove("abierto");
      document.body.style.overflow = "";
    }

    function irAlCheckout() {
      const carrito = obtenerCarrito();
      if (carrito.length === 0) return;
      window.location.href = "checkout.html";
    }

    document.getElementById("btn-abrir-carrito").addEventListener("click", abrirCarrito);
    document.getElementById("btn-cerrar-carrito").addEventListener("click", cerrarCarrito);
    document.getElementById("fondo-carrito").addEventListener("click", cerrarCarrito);
    document.getElementById("btn-enviar-pedido").addEventListener("click", irAlCheckout);
    document.getElementById("btn-vaciar-carrito").addEventListener("click", () => {
      if (confirm("¿Vaciar todo tu pedido?")) {
        guardarCarrito([]);
        renderizarCarrito();
      }
    });

    actualizarBadgeCarrito();

    iniciar();
  </script>

</body>
</html>
