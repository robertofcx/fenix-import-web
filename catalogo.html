<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Fenix Import Perú</title>
<meta name="description" content="Catálogo de productos Fenix Import Perú: tecnología, iluminación, seguridad y más.">
<link rel="canonical" href="https://fenix-import-peru.onrender.com/catalogo.html">
<link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">

<meta property="og:type" content="website">
<meta property="og:title" content="Catálogo — Fenix Import Perú">
<meta property="og:description" content="Más de 2000 productos de tecnología, iluminación y seguridad.">
<meta property="og:image" content="https://fenix-import-peru.onrender.com/logo.webp">
<meta property="og:url" content="https://fenix-import-peru.onrender.com/catalogo.html">
<meta property="og:locale" content="es_PE">
<meta name="twitter:card" content="summary">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/carrito.css">
<link rel="stylesheet" href="/css/footer.css">
<link rel="stylesheet" href="/css/catalogo.css">
</head>
<body>

  <div id="header-placeholder"></div>
  <script src="/js/util.js"></script>
  <script src="/js/header.js"></script>

  <div class="fondo-carrito" id="fondo-carrito"></div>
  <div class="drawer-carrito" id="drawer-carrito">
    <div class="carrito-header">
      <h2>Tu pedido</h2>
      <button class="btn-cerrar-drawer" id="btn-cerrar-carrito" aria-label="Cerrar carrito">✕</button>
    </div>
    <div class="carrito-lista" id="carrito-lista"></div>
    <div class="carrito-footer" id="carrito-footer" style="display:none;">
      <div class="carrito-total">
        <span>Total</span>
        <span id="carrito-total-monto">S/ 0.00</span>
      </div>
      <button class="btn-enviar-pedido" id="btn-enviar-pedido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        Finalizar pedido
      </button>
      <button class="btn-vaciar-carrito" id="btn-vaciar-carrito">Vaciar carrito</button>
    </div>
  </div>

  <div class="toast-carrito" id="toast-carrito"></div>

  <div class="barra-titulo">
    <p class="breadcrumb" id="breadcrumb"><a href="index.html">Inicio</a> <span class="sep">›</span> <span class="actual">Catálogo</span></p>
    <h1 class="titulo-catalogo">Catálogo</h1>
  </div>

  <button class="btn-abrir-filtros" id="btn-abrir-filtros">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="10" y1="18" x2="14" y2="18"/></svg>
    Filtros
    <span class="badge-filtros-activos" id="badge-filtros-activos" style="display:none;">0</span>
  </button>

  <div class="pagina-catalogo">
    <div class="fondo-filtros" id="fondo-filtros"></div>

    <aside class="sidebar-filtros" id="sidebar-filtros">
      <div class="sidebar-filtros-header">
        <h2>Filtros</h2>
        <button class="btn-cerrar-drawer" id="btn-cerrar-filtros" aria-label="Cerrar filtros">✕</button>
      </div>

      <div class="filtro-seccion">
        <div class="buscador">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="input-buscar" placeholder="Filtrar por nombre o código Fenix...">
        </div>
      </div>

      <div class="filtro-seccion">
        <h3 class="filtro-titulo">Categoría</h3>
        <div class="lista-categorias" id="lista-categorias"></div>
      </div>

      <div class="filtro-seccion">
        <h3 class="filtro-titulo">Marca</h3>
        <div class="lista-marcas" id="lista-marcas"></div>
      </div>

      <div class="filtro-seccion">
        <h3 class="filtro-titulo">Precio</h3>
        <div class="filtro-precio">
          <span>S/</span>
          <input type="number" id="input-precio-min" placeholder="Mín" min="0">
          <span>—</span>
          <input type="number" id="input-precio-max" placeholder="Máx" min="0">
        </div>
      </div>

      <div class="filtro-seccion">
        <label class="filtro-check">
          <input type="checkbox" id="input-solo-ofertas">
          Solo ofertas
        </label>
      </div>

      <button class="btn-limpiar-filtros" id="btn-limpiar-filtros">Limpiar filtros</button>
    </aside>

    <main class="catalogo-principal">
      <div id="estado-carga" class="estado">
        <div class="spinner"></div>
        <p class="estado-texto">Cargando catálogo...</p>
      </div>

      <div id="contenido" style="display:none;">
        <div class="catalogo-toolbar">
          <p class="contador" id="contador"></p>
          <div class="orden-selector">
            <label for="select-orden">Ordenar por</label>
            <select id="select-orden">
              <option value="predeterminado">Predeterminado</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="nombre-asc">Nombre: A-Z</option>
              <option value="ofertas">Ofertas primero</option>
            </select>
          </div>
        </div>

        <div class="grilla" id="grilla"></div>

        <nav class="paginacion" id="paginacion"></nav>
      </div>
    </main>
  </div>

  <div id="footer-placeholder" data-variant="completo"></div>
  <script src="/js/footer.js"></script>

  <a class="whatsapp-flotante" href="#" id="whatsapp-flotante" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.56-1.17-2.98s.74-2.11 1-2.4c.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.3.37-.43.5-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.31 2.35 1.45.29.15.46.13.63-.07.17-.2.72-.83.91-1.11.19-.29.38-.24.63-.14.26.1 1.63.77 1.91.91.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg></a>

  <script src="/js/categoria.js"></script>

</body>

</html>
