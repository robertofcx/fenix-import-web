<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo — Fenix Import Perú</title>
<meta name="description" content="Catálogo de productos Fenix Import Perú: tecnología, iluminación, seguridad y más.">

<meta property="og:description" content="Más de 2000 productos de tecnología, iluminación y seguridad.">

<meta property="og:url" content="https://fenix-import-peru.onrender.com/catalogo.html">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/7.0.0/fuse.min.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --bg-elevada: #f5f6fb;
    --bg-elevada-hover: #ebedf7;
    --texto: #14152b;
    --texto-muted: #5c5e78;
    --linea: rgba(30, 33, 166, 0.12);
    --azul: #1E21A6;
    --azul-hover: #15187e;
    --ember: #F7941E;
    --ember-hover: #dd8210;
    --texto-sobre-azul: #ffffff;
    --texto-sobre-ember: #241300;
    --whatsapp: #25d366;
    --whatsapp-dark: #1ea952;
    --sombra: rgba(20, 21, 43, 0.14);
  }

  html[data-tema="oscuro"] {
    --bg: #0b0c1e;
    --bg-elevada: #14152c;
    --bg-elevada-hover: #1c1e3d;
    --texto: #f1f1fa;
    --texto-muted: #9294b8;
    --linea: rgba(130, 140, 255, 0.18);
    --azul: #4d52e0;
    --azul-hover: #6266e0;
    --ember: #ffab3d;
    --ember-hover: #ffbd66;
    --texto-sobre-azul: #ffffff;
    --texto-sobre-ember: #1a0f00;
    --sombra: rgba(0, 0, 0, 0.5);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--texto);
    font-family: 'Inter', sans-serif;
    transition: background 0.2s ease, color 0.2s ease;
  }

  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--linea);
  }

  html[data-tema="oscuro"] header { background: rgba(11, 12, 30, 0.92); }

  .header-fila {
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .btn-hamburguesa {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--bg-elevada); border: 1px solid var(--linea); color: var(--texto);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .btn-hamburguesa svg { width: 20px; height: 20px; }

  .logo-chip {
    background: #ffffff;
    padding: 6px 12px;
    border-radius: 10px;
    display: flex;
    align-items: center;
  }
  .logo-chip img { height: 30px; width: auto; display: block; }

  .header-derecha { display: flex; align-items: center; gap: 8px; }

  .btn-tema {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-elevada); border: 1px solid var(--linea); color: var(--texto);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .btn-tema svg { width: 18px; height: 18px; }
  .icono-luna { display: none; }
  html[data-tema="claro"] .icono-sol { display: none; }
  html[data-tema="claro"] .icono-luna { display: block; }

  .btn-nav-whatsapp {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--whatsapp); flex-shrink: 0;
  }
  .btn-nav-whatsapp svg { width: 19px; height: 19px; fill: #0d1f13; }

  /* ---------- Carrito ---------- */

  .btn-carrito {
    position: relative;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-elevada); border: 1px solid var(--linea); color: var(--texto);
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .btn-carrito svg { width: 19px; height: 19px; }

  .badge-carrito {
    position: absolute;
    top: -4px; right: -4px;
    min-width: 18px; height: 18px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--ember);
    color: var(--texto-sobre-ember);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .fondo-carrito { display: none; position: fixed; inset: 0; background: rgba(10, 8, 6, 0.6); z-index: 40; }
  .fondo-carrito.abierto { display: block; }

  .drawer-carrito {
    position: fixed; top: 0; right: 0; bottom: 0; width: 88%; max-width: 380px;
    background: var(--bg-elevada); border-left: 1px solid var(--linea); z-index: 41;
    transform: translateX(100%); transition: transform 0.25s ease;
    display: flex; flex-direction: column;
  }
  .drawer-carrito.abierto { transform: translateX(0); }

  .carrito-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px; border-bottom: 1px solid var(--linea); flex-shrink: 0;
  }
  .carrito-header h2 { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.2rem; margin: 0; }

  .carrito-lista { flex: 1; overflow-y: auto; padding: 10px 18px; }

  .carrito-item {
    display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--linea);
  }
  .carrito-item:last-child { border-bottom: none; }

  .carrito-item-img {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px;
    background: var(--bg); display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .carrito-item-img img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }

  .carrito-item-info { flex: 1; min-width: 0; }
  .carrito-item-nombre {
    font-size: 0.82rem; font-weight: 500; margin: 0 0 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .carrito-item-precio { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--texto-muted); margin: 0 0 6px; }

  .carrito-item-controles { display: flex; align-items: center; gap: 8px; }
  .carrito-item-controles button {
    width: 24px; height: 24px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--linea); color: var(--texto);
    cursor: pointer; font-size: 0.9rem; line-height: 1;
  }
  .carrito-item-cantidad { font-size: 0.82rem; font-weight: 600; min-width: 18px; text-align: center; }

  .carrito-item-quitar {
    background: none; border: none; color: var(--texto-muted); cursor: pointer;
    font-size: 0.72rem; text-decoration: underline; margin-left: auto; padding: 0;
  }
  .carrito-item-quitar:hover { color: var(--ember); }

  .carrito-vacio { text-align: center; padding: 50px 20px; color: var(--texto-muted); font-size: 0.88rem; }

  .carrito-footer { padding: 16px 18px; border-top: 1px solid var(--linea); flex-shrink: 0; }

  .carrito-total {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 14px; font-family: 'Big Shoulders Display', sans-serif;
  }
  .carrito-total span:first-child { font-size: 0.85rem; font-weight: 600; color: var(--texto-muted); font-family: 'Inter', sans-serif; }
  .carrito-total span:last-child { font-size: 1.5rem; font-weight: 800; color: var(--texto); }

  .btn-enviar-pedido {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; background: var(--whatsapp); color: #0d1f13; border: none;
    font-weight: 700; font-size: 0.95rem; padding: 14px; border-radius: 11px; cursor: pointer;
  }
  .btn-enviar-pedido:hover { background: var(--whatsapp-dark); }
  .btn-enviar-pedido svg { width: 18px; height: 18px; }

  .btn-vaciar-carrito {
    display: block; width: 100%; text-align: center; background: none; border: none;
    color: var(--texto-muted); font-size: 0.78rem; margin-top: 10px; cursor: pointer; padding: 4px;
  }
  .btn-vaciar-carrito:hover { color: var(--ember); }

  .toast-carrito {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--texto);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }
  .toast-carrito.visible { opacity: 1; transform: translateX(-50%) translateY(0); }


  .header-buscador-fila { padding: 0 20px 12px; }

  .buscador {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-elevada);
    border: 1px solid var(--linea);
    border-radius: 12px;
    padding: 4px 4px 4px 14px;
    max-width: 640px;
    margin: 0 auto;
  }

  .buscador svg { flex-shrink: 0; opacity: 0.55; width: 17px; height: 17px; }

  .buscador input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--texto); font-family: 'Inter', sans-serif; font-size: 0.9rem; padding: 9px 0;
  }
  .buscador input::placeholder { color: var(--texto-muted); }

  /* ---------- Menú lateral (drawer) ---------- */

  .fondo-drawer { display: none; position: fixed; inset: 0; background: rgba(10, 8, 6, 0.6); z-index: 40; }
  .fondo-drawer.abierto { display: block; }

  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 82%; max-width: 320px;
    background: var(--bg-elevada); border-right: 1px solid var(--linea); z-index: 41;
    transform: translateX(-100%); transition: transform 0.25s ease;
    overflow-y: auto; padding: 18px; display: flex; flex-direction: column;
  }
  .drawer.abierto { transform: translateX(0); }

  .drawer-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .drawer-header img { height: 26px; }

  .btn-cerrar-drawer {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--bg); border: 1px solid var(--linea); color: var(--texto); cursor: pointer; font-size: 1rem;
  }

  .drawer-seccion-titulo {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--texto-muted); margin: 18px 0 8px;
  }

  .drawer-link { display: block; padding: 11px 10px; border-radius: 9px; font-weight: 600; font-size: 0.92rem; }
  .drawer-link:hover { background: var(--bg-elevada-hover); }

  .drawer-item { border-bottom: 1px solid var(--linea); }
  .drawer-item:last-child { border-bottom: none; }

  .drawer-categoria-fila {
    width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 13px 10px; background: none; border: none; color: var(--texto);
    font-size: 0.9rem; font-weight: 500; text-align: left; cursor: pointer;
  }
  .drawer-categoria-fila:hover { color: var(--azul); }
  .drawer-categoria-fila .cantidad { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; color: var(--texto-muted); margin-right: auto; margin-left: 8px; }
  .drawer-categoria-fila .chevron { width: 14px; height: 14px; flex-shrink: 0; color: var(--texto-muted); transition: transform 0.2s ease; }
  .drawer-item.abierto .drawer-categoria-fila .chevron { transform: rotate(90deg); }
  .drawer-item.abierto .drawer-categoria-fila { color: var(--azul); }

  .drawer-subcategorias { display: none; flex-direction: column; padding: 0 10px 10px 18px; }
  .drawer-item.abierto .drawer-subcategorias { display: flex; }

  .drawer-subcategoria {
    display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.82rem;
    color: var(--texto-muted); border-left: 2px solid var(--linea); padding-left: 12px;
  }
  .drawer-subcategoria:hover { color: var(--ember); }
  .drawer-subcategoria .n { font-family: 'IBM Plex Mono', monospace; font-size: 0.64rem; }

  .drawer-categoria-sola {
    display: flex; justify-content: space-between; align-items: center; padding: 13px 10px;
    font-size: 0.9rem; font-weight: 500; color: var(--texto); border-bottom: 1px solid var(--linea);
  }
  .drawer-categoria-sola:hover { color: var(--azul); }
  .drawer-categoria-sola .cantidad { font-family: 'IBM Plex Mono', monospace; font-size: 0.66rem; color: var(--texto-muted); }

  .drawer-redes { display: flex; gap: 10px; margin-top: auto; padding-top: 18px; }
  .drawer-redes a {
    width: 36px; height: 36px; border-radius: 50%; background: var(--bg); border: 1px solid var(--linea);
    display: flex; align-items: center; justify-content: center;
  }
  .drawer-redes svg { width: 16px; height: 16px; }

  /* ---------- Breadcrumb + título ---------- */

  .barra-titulo {
    max-width: 1200px;
    margin: 0 auto;
    padding: 18px 20px 0;
  }

  .breadcrumb {
    font-size: 0.8rem;
    color: var(--texto-muted);
    margin-bottom: 6px;
  }
  .breadcrumb a:hover { color: var(--azul); }
  .breadcrumb .sep { opacity: 0.5; margin: 0 4px; }
  .breadcrumb .actual { color: var(--texto); font-weight: 500; }

  .titulo-catalogo {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    margin: 0 0 14px;
  }

  /* ---------- Categorías (chips) ---------- */

  .categorias {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .categorias::-webkit-scrollbar { height: 4px; }
  .categorias::-webkit-scrollbar-thumb { background: var(--linea); border-radius: 4px; }

  .chip {
    flex-shrink: 0;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--texto-muted);
    background: var(--bg-elevada);
    border: 1px solid var(--linea);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }

  .chip:hover { color: var(--texto); border-color: var(--azul); }

  .chip.activo {
    background: var(--azul);
    color: var(--texto-sobre-azul);
    border-color: var(--azul);
    font-weight: 600;
  }

  /* ---------- Filtros ---------- */

  .filtros {
    max-width: 1200px;
    margin: 12px auto 0;
    padding: 0 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .filtro-precio {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-elevada);
    border: 1px solid var(--linea);
    border-radius: 10px;
    padding: 8px 12px;
  }

  .filtro-precio span { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--texto-muted); }

  .filtro-precio input[type="number"] {
    width: 64px; background: transparent; border: none; outline: none;
    color: var(--texto); font-family: 'Inter', sans-serif; font-size: 0.85rem;
  }

  .filtro-check {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-elevada); border: 1px solid var(--linea); border-radius: 10px;
    padding: 9px 12px; cursor: pointer; font-size: 0.82rem; color: var(--texto-muted); user-select: none;
  }
  .filtro-check input { accent-color: var(--ember); width: 15px; height: 15px; }

  .btn-limpiar-filtros {
    background: none; border: none; color: var(--azul);
    font-size: 0.8rem; font-weight: 600; cursor: pointer; padding: 8px 4px;
  }
  .btn-limpiar-filtros:hover { text-decoration: underline; }

  /* ---------- Estado (carga / error / vacío) ---------- */

  .estado {
    max-width: 420px;
    margin: 60px auto;
    text-align: center;
    padding: 0 20px;
  }

  .estado-icono { font-size: 2rem; margin-bottom: 12px; }
  .estado-titulo { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.4rem; margin: 0 0 8px; }
  .estado-texto { color: var(--texto-muted); font-size: 0.9rem; line-height: 1.5; }

  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--linea); border-top-color: var(--azul); border-radius: 50%;
    margin: 0 auto 16px; animation: girar 0.8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  /* ---------- Grilla de productos ---------- */

  main { padding: 20px; max-width: 1200px; margin: 0 auto; }

  .contador { font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: var(--texto-muted); margin: 4px 0 16px; }

  .grilla {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }

  .tarjeta {
    background: var(--bg-elevada);
    border: 1px solid var(--linea);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .tarjeta:hover { border-color: var(--azul); transform: translateY(-2px); }

  .tarjeta-img {
    aspect-ratio: 1; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
  }
  .tarjeta-img img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
  .tarjeta-img .sin-foto { color: var(--texto-muted); font-size: 0.7rem; font-family: 'IBM Plex Mono', monospace; }

  .badge-oferta {
    position: absolute; top: 8px; right: 8px;
    background: var(--ember); color: var(--texto-sobre-ember);
    font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px;
  }

  .tarjeta-body { padding: 12px; display: flex; flex-direction: column; flex: 1; }

  .tarjeta-categoria {
    font-family: 'IBM Plex Mono', monospace; font-size: 0.63rem; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--ember); margin-bottom: 4px;
  }

  .tarjeta-nombre {
    font-size: 0.85rem; font-weight: 500; line-height: 1.3; margin: 0 0 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1;
  }

  .tarjeta-precio {
    font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.25rem; color: var(--texto); margin: 0 0 10px;
  }

  .tarjeta-acciones { display: flex; gap: 6px; }

  .btn-agregar-carrito {
    flex: 1;
    background: var(--azul); color: var(--texto-sobre-azul); border: none;
    font-size: 0.78rem; font-weight: 600;
    padding: 9px; border-radius: 9px; cursor: pointer; transition: background 0.15s ease;
  }
  .btn-agregar-carrito:hover { background: var(--azul-hover); }

  .btn-consultar-icono {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    width: 34px;
    background: var(--whatsapp); color: #0d1f13; border-radius: 9px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-consultar-icono:hover { background: var(--whatsapp-dark); }
  .btn-consultar-icono svg { width: 15px; height: 15px; }

  .cargar-mas {
    display: block; margin: 28px auto 10px;
    background: var(--bg-elevada); border: 1px solid var(--linea); color: var(--texto);
    font-weight: 600; font-size: 0.9rem; padding: 12px 28px; border-radius: 10px; cursor: pointer;
  }
  .cargar-mas:hover { border-color: var(--azul); }

  /* ---------- Footer ---------- */

  footer { background: var(--bg-elevada); border-top: 1px solid var(--linea); padding: 40px 24px 20px; margin-top: 40px; }
  .footer-abajo { max-width: 1100px; margin: 0 auto; text-align: center; font-size: 0.78rem; color: var(--texto-muted); }

  .whatsapp-flotante {
    position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--whatsapp); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px var(--sombra); z-index: 20;
  }
  .whatsapp-flotante svg { width: 28px; height: 28px; fill: #0d1f13; }
</style>
</head>
<body>

  <header>
    <div class="header-fila">
      <button class="btn-hamburguesa" id="btn-abrir-drawer" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

  <a class="whatsapp-flotante" href="#" id="whatsapp-flotante" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.56-1.17-2.98s.74-2.11 1-2.4c.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.3.37-.43.5-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.31 2.35 1.45.29.15.46.13.63-.07.17-.2.72-.83.91-1.11.19-.29.38-.24.63-.14.26.1 1.63.77 1.91.91.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg></a>

  <script>
    const RUTA_PRODUCTOS = "productos.json";
    const NUMERO_WHATSAPP = "51978821080";
    const LOTE = 24;
    let fuse = null;

    document.getElementById("anio").textContent = new Date().getFullYear();

    const mensajeGenerico = "¡Hola Fenix Import Perú!\nMe gustaría más información sobre sus productos.";
    const urlWhatsAppGenerico = "https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensajeGenerico);
    ["nav-whatsapp", "whatsapp-flotante"].forEach(id => { document.getElementById(id).href = urlWhatsAppGenerico; });

    // ---------- Tema oscuro / claro ----------
    const raiz = document.documentElement;
    function aplicarTema(tema) { raiz.setAttribute("data-tema", tema); localStorage.setItem("fenix-tema", tema); }
    aplicarTema(localStorage.getItem("fenix-tema") || "claro");
    document.getElementById("btn-tema").addEventListener("click", () => {
      aplicarTema(raiz.getAttribute("data-tema") === "claro" ? "oscuro" : "claro");
    });

    // ---------- Menú lateral ----------
    const drawer = document.getElementById("drawer");
    const fondoDrawer = document.getElementById("fondo-drawer");
    function abrirDrawer() { drawer.classList.add("abierto"); fondoDrawer.classList.add("abierto"); document.body.style.overflow = "hidden"; }
    function cerrarDrawer() { drawer.classList.remove("abierto"); fondoDrawer.classList.remove("abierto"); document.body.style.overflow = ""; }
    document.getElementById("btn-abrir-drawer").addEventListener("click", abrirDrawer);
    document.getElementById("btn-cerrar-drawer").addEventListener("click", cerrarDrawer);
    fondoDrawer.addEventListener("click", cerrarDrawer);
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarDrawer(); });

    let todosLosProductos = [];
    let productosFiltrados = [];
    let categoriaActiva = new URLSearchParams(window.location.search).get("categoria") || "Todos";
    let subcategoriaActiva = new URLSearchParams(window.location.search).get("subcategoria") || null;
    let cantidadMostrada = 0;

    const elEstadoCarga = document.getElementById("estado-carga");
    const elContenido = document.getElementById("contenido");
    const elGrilla = document.getElementById("grilla");
    const elContador = document.getElementById("contador");
    const elCategorias = document.getElementById("lista-categorias");
    const elBuscar = document.getElementById("input-buscar");
    const elBtnCargarMas = document.getElementById("btn-cargar-mas");
    const elPrecioMin = document.getElementById("input-precio-min");
    const elPrecioMax = document.getElementById("input-precio-max");
    const elSoloOfertas = document.getElementById("input-solo-ofertas");
    const elBtnLimpiarFiltros = document.getElementById("btn-limpiar-filtros");
    const elBreadcrumb = document.getElementById("breadcrumb");

    function actualizarBreadcrumb() {
      let html = `<a href="index.html">Inicio</a>`;
      if (categoriaActiva !== "Todos") {
        if (subcategoriaActiva) {
          html += ` <span class="sep">›</span> <a href="catalogo.html?categoria=${encodeURIComponent(categoriaActiva)}">${categoriaActiva}</a>`;
          html += ` <span class="sep">›</span> <span class="actual">${subcategoriaActiva}</span>`;
        } else {
          html += ` <span class="sep">›</span> <span class="actual">${categoriaActiva}</span>`;
        }
      } else {
        html += ` <span class="sep">›</span> <span class="actual">Catálogo</span>`;
      }
      elBreadcrumb.innerHTML = html;
    }

    function mostrarError(mensaje) {
      elEstadoCarga.innerHTML = `<div class="estado-icono">⚠️</div><p class="estado-titulo">No se pudo cargar el catálogo</p><p class="estado-texto">${mensaje}</p>`;
    }

    function mostrarVacio() {
      elGrilla.innerHTML = `<div class="estado" style="grid-column: 1 / -1;"><div class="estado-icono">🔦</div><p class="estado-titulo">No encontramos productos</p><p class="estado-texto">Prueba con otra palabra o revisa otra categoría.</p></div>`;
      elBtnCargarMas.style.display = "none";
    }

    function urlWhatsApp(producto) {
      const mensaje = `¡Hola Fenix Import Perú!\nMe interesa este producto de su catálogo:\n\n${producto.nombre}\nSKU: ${producto.sku}\n\n¿Me brinda mayor información por favor?`;
      return `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
    }

    function crearTarjeta(producto) {
      const precio = Number(String(producto.precio).replace(/[^0-9.]/g, "")).toFixed(2);
      const imagenHtml = producto.imagen
        ? `<img src="${producto.imagen}" alt="${producto.nombre}" loading="lazy">`
        : `<span class="sin-foto">Sin foto</span>`;
      const badge = producto.oferta ? `<span class="badge-oferta">Oferta</span>` : "";
      const productoJson = encodeURIComponent(JSON.stringify({ sku: producto.sku, nombre: producto.nombre, precio: producto.precio, imagen: producto.imagen }));

      return `
        <a class="tarjeta" href="producto.html?sku=${encodeURIComponent(producto.sku)}">
          <div class="tarjeta-img">${badge}${imagenHtml}</div>
          <div class="tarjeta-body">
            <p class="tarjeta-categoria">${producto.categoria || ""}</p>
            <p class="tarjeta-nombre">${producto.nombre}</p>
            <p class="tarjeta-precio">S/ ${precio}</p>
            <div class="tarjeta-acciones">
              <button class="btn-agregar-carrito" onclick="event.preventDefault(); agregarAlCarritoDesdeTarjeta('${productoJson}')">
                + Agregar
              </button>
              <span class="btn-consultar-icono" onclick="event.preventDefault(); window.open('${urlWhatsApp(producto)}', '_blank')" aria-label="Consultar por WhatsApp">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.16c-.24.68-1.4 1.3-1.93 1.38-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.56-1.17-2.98s.74-2.11 1-2.4c.26-.29.58-.36.77-.36.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.15.12.32.02.51-.1.19-.15.31-.29.48-.15.17-.3.37-.43.5-.15.15-.3.31-.13.6.17.29.76 1.25 1.63 2.02 1.12.99 2.06 1.31 2.35 1.45.29.15.46.13.63-.07.17-.2.72-.83.91-1.11.19-.29.38-.24.63-.14.26.1 1.63.77 1.91.91.29.14.48.21.55.33.07.12.07.68-.17 1.36z"/></svg>
              </span>
            </div>
          </div>
        </a>
      `;
    }

    function renderizarLote() {
      const siguienteLote = productosFiltrados.slice(cantidadMostrada, cantidadMostrada + LOTE);
      elGrilla.insertAdjacentHTML("beforeend", siguienteLote.map(crearTarjeta).join(""));
      cantidadMostrada += siguienteLote.length;
      elBtnCargarMas.style.display = cantidadMostrada < productosFiltrados.length ? "block" : "none";
      elContador.textContent = `${productosFiltrados.length} producto${productosFiltrados.length === 1 ? "" : "s"} encontrado${productosFiltrados.length === 1 ? "" : "s"}`;
    }

    function extraerPrecio(producto) {
      return Number(String(producto.precio).replace(/[^0-9.]/g, "")) || 0;
    }

    function aplicarFiltros() {
      const texto = elBuscar.value.trim();
      const precioMin = elPrecioMin.value !== "" ? Number(elPrecioMin.value) : null;
      const precioMax = elPrecioMax.value !== "" ? Number(elPrecioMax.value) : null;
      const soloOfertas = elSoloOfertas.checked;

      const candidatos = (texto && fuse) ? fuse.search(texto).map(r => r.item) : todosLosProductos;

      productosFiltrados = candidatos.filter(p => {
        const coincideCategoria = categoriaActiva === "Todos" || p.categoria === categoriaActiva;
        const coincideSubcategoria = !subcategoriaActiva || p.subcategoria === subcategoriaActiva;
        const precio = extraerPrecio(p);
        const coincidePrecioMin = precioMin === null || precio >= precioMin;
        const coincidePrecioMax = precioMax === null || precio <= precioMax;
        const coincideOferta = !soloOfertas || p.oferta;
        return coincideCategoria && coincideSubcategoria && coincidePrecioMin && coincidePrecioMax && coincideOferta;
      });

      elGrilla.innerHTML = "";
      cantidadMostrada = 0;

      if (productosFiltrados.length === 0) {
        mostrarVacio();
        elContador.textContent = "0 productos encontrados";
        return;
      }

      renderizarLote();
    }

    function construirCategorias() {
      const categoriasUnicas = ["Todos", ...new Set(todosLosProductos.map(p => p.categoria).filter(Boolean))];

      elCategorias.innerHTML = categoriasUnicas.map(cat => {
        const activo = cat === categoriaActiva ? "activo" : "";
        return `<button class="chip ${activo}" data-cat="${cat}">${cat}</button>`;
      }).join("");

      elCategorias.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
          categoriaActiva = chip.dataset.cat;
          subcategoriaActiva = null;
          elCategorias.querySelectorAll(".chip").forEach(c => c.classList.remove("activo"));
          chip.classList.add("activo");
          actualizarBreadcrumb();
          aplicarFiltros();
        });
      });
    }

    function dibujarDrawerCategorias(categorias) {
      const elDrawerCategorias = document.getElementById("drawer-categorias");

      elDrawerCategorias.innerHTML = categorias.map((cat, indice) => {
        const tieneSubcategorias = cat.subcategorias && cat.subcategorias.length > 0;
        if (!tieneSubcategorias) {
          return `<a class="drawer-categoria-sola" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}"><span>${cat.nombre}</span><span class="cantidad">${cat.cantidad}</span></a>`;
        }
        const subHtml = cat.subcategorias.map(sub => `
          <a class="drawer-subcategoria" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}&subcategoria=${encodeURIComponent(sub.nombre)}">
            <span>${sub.nombre}</span><span class="n">${sub.cantidad}</span>
          </a>`).join("");
        return `
          <div class="drawer-item" id="drawer-item-${indice}">
            <button class="drawer-categoria-fila" data-indice="${indice}">
              <span>${cat.nombre}</span><span class="cantidad">${cat.cantidad}</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </button>
            <div class="drawer-subcategorias">
              <a class="drawer-subcategoria" href="catalogo.html?categoria=${encodeURIComponent(cat.nombre)}" style="font-weight:600; color:var(--texto);"><span>Ver todo en ${cat.nombre}</span></a>
              ${subHtml}
            </div>
          </div>`;
      }).join("");

      elDrawerCategorias.querySelectorAll(".drawer-categoria-fila").forEach(boton => {
        boton.addEventListener("click", () => {
          document.getElementById("drawer-item-" + boton.dataset.indice).classList.toggle("abierto");
        });
      });
    }

    async function cargarCatalogo() {
      try {
        const respuesta = await fetch(RUTA_PRODUCTOS);
        if (!respuesta.ok) throw new Error("No se pudo cargar productos.json (" + respuesta.status + ")");

        const datos = await respuesta.json();

        todosLosProductos = datos.productos || [];
        if (todosLosProductos.length === 0) {
          mostrarError("El catálogo está vacío por ahora. Vuelve a intentarlo más tarde.");
          return;
        }

        fuse = new Fuse(todosLosProductos, {
          keys: ["nombre", "sku"],
          threshold: 0.35,
          ignoreLocation: true
        });

        elEstadoCarga.style.display = "none";
        elContenido.style.display = "block";

        construirCategorias();
        dibujarDrawerCategorias(datos.categorias || []);

        const buscarUrl = new URLSearchParams(window.location.search).get("buscar");
        if (buscarUrl) elBuscar.value = buscarUrl;

        actualizarBreadcrumb();
        aplicarFiltros();

      } catch (error) {
        mostrarError("Ocurrió un problema al conectar con el catálogo. Intenta recargar la página en unos minutos.");
        console.error(error);
      }
    }

    elBuscar.addEventListener("input", aplicarFiltros);
    elBtnCargarMas.addEventListener("click", renderizarLote);
    elPrecioMin.addEventListener("input", aplicarFiltros);
    elPrecioMax.addEventListener("input", aplicarFiltros);
    elSoloOfertas.addEventListener("change", aplicarFiltros);
    elBtnLimpiarFiltros.addEventListener("click", () => {
      elBuscar.value = "";
      elPrecioMin.value = "";
      elPrecioMax.value = "";
    // ========================================================================
    // CARRITO DE WHATSAPP
    // ========================================================================
    const CARRITO_KEY = "fenix_carrito";

    function obtenerCarrito() {
      try {
        return JSON.parse(localStorage.getItem(CARRITO_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function guardarCarrito(carrito) {
      localStorage.setItem(CARRITO_KEY, JSON.stringify(carrito));
      actualizarBadgeCarrito();
    }

    function actualizarBadgeCarrito() {
      const carrito = obtenerCarrito();
      const totalItems = carrito.reduce((suma, item) => suma + item.cantidad, 0);
      const elBadge = document.getElementById("badge-carrito");
      if (totalItems > 0) {
        elBadge.textContent = totalItems;
        elBadge.style.display = "flex";
      } else {
        elBadge.style.display = "none";
      }
    }

    function mostrarToast(mensaje) {
      const elToast = document.getElementById("toast-carrito");
      elToast.textContent = mensaje;
      elToast.classList.add("visible");
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => elToast.classList.remove("visible"), 2200);
    }

    function agregarAlCarrito(producto, mostrarConfirmacion = true) {
      const carrito = obtenerCarrito();
      const existente = carrito.find(item => item.sku === producto.sku);

      if (existente) {
        existente.cantidad += 1;
      } else {
        carrito.push({ sku: producto.sku, nombre: producto.nombre, precio: producto.precio, imagen: producto.imagen, cantidad: 1 });
      }

      guardarCarrito(carrito);
      if (mostrarConfirmacion) mostrarToast("✓ Agregado a tu pedido");
    }

    // Usada desde el onclick de cada tarjeta (recibe el producto codificado en la URL)
    function agregarAlCarritoDesdeTarjeta(productoJsonCodificado) {
      const producto = JSON.parse(decodeURIComponent(productoJsonCodificado));
      agregarAlCarrito(producto);
    }

    function quitarDelCarrito(sku) {
      const carrito = obtenerCarrito().filter(item => item.sku !== sku);
      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function cambiarCantidad(sku, delta) {
      const carrito = obtenerCarrito();
      const item = carrito.find(i => i.sku === sku);
      if (!item) return;

      item.cantidad += delta;
      if (item.cantidad <= 0) {
        quitarDelCarrito(sku);
        return;
      }

      guardarCarrito(carrito);
      renderizarCarrito();
    }

    function extraerPrecioNumerico(precio) {
      return Number(String(precio).replace(/[^0-9.]/g, "")) || 0;
    }

    function renderizarCarrito() {
      const carrito = obtenerCarrito();
      const elLista = document.getElementById("carrito-lista");
      const elFooter = document.getElementById("carrito-footer");

      if (carrito.length === 0) {
        elLista.innerHTML = `<div class="carrito-vacio">Tu pedido está vacío.<br>Agrega productos desde el catálogo.</div>`;
        elFooter.style.display = "none";
        return;
      }

      elFooter.style.display = "block";

      elLista.innerHTML = carrito.map(item => {
        const precioUnit = extraerPrecioNumerico(item.precio);
        const imagenHtml = item.imagen
          ? `<img src="${item.imagen}" alt="${item.nombre}">`
          : "";

        return `
          <div class="carrito-item">
            <div class="carrito-item-img">${imagenHtml}</div>
            <div class="carrito-item-info">
              <p class="carrito-item-nombre">${item.nombre}</p>
              <p class="carrito-item-precio">S/ ${precioUnit.toFixed(2)} c/u</p>
              <div class="carrito-item-controles">
                <button onclick="cambiarCantidad('${item.sku}', -1)" aria-label="Quitar uno">−</button>
                <span class="carrito-item-cantidad">${item.cantidad}</span>
                <button onclick="cambiarCantidad('${item.sku}', 1)" aria-label="Agregar uno">+</button>
                <button class="carrito-item-quitar" onclick="quitarDelCarrito('${item.sku}')">Quitar</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      const total = carrito.reduce((suma, item) => suma + extraerPrecioNumerico(item.precio) * item.cantidad, 0);
      document.getElementById("carrito-total-monto").textContent = "S/ " + total.toFixed(2);
    }

    function abrirCarrito() {
      renderizarCarrito();
      document.getElementById("drawer-carrito").classList.add("abierto");
      document.getElementById("fondo-carrito").classList.add("abierto");
      document.body.style.overflow = "hidden";
    }

    function cerrarCarrito() {
      document.getElementById("drawer-carrito").classList.remove("abierto");
      document.getElementById("fondo-carrito").classList.remove("abierto");
      document.body.style.overflow = "";
    }

    function enviarPedidoWhatsApp() {
      const carrito = obtenerCarrito();
      if (carrito.length === 0) return;

      let mensaje = "¡Hola Fenix Import Perú! Quiero hacer este pedido:\n\n";

      carrito.forEach(item => {
        const precioUnit = extraerPrecioNumerico(item.precio);
        mensaje += `• ${item.nombre} (SKU: ${item.sku})\n  Cantidad: ${item.cantidad} — S/ ${(precioUnit * item.cantidad).toFixed(2)}\n\n`;
      });

      const total = carrito.reduce((suma, item) => suma + extraerPrecioNumerico(item.precio) * item.cantidad, 0);
      mensaje += `Total estimado: S/ ${total.toFixed(2)}\n\n¿Me confirman disponibilidad y coordinamos la entrega?`;

      window.open("https://wa.me/" + NUMERO_WHATSAPP + "?text=" + encodeURIComponent(mensaje), "_blank");
    }

    document.getElementById("btn-abrir-carrito").addEventListener("click", abrirCarrito);
    document.getElementById("btn-cerrar-carrito").addEventListener("click", cerrarCarrito);
    document.getElementById("fondo-carrito").addEventListener("click", cerrarCarrito);
    document.getElementById("btn-enviar-pedido").addEventListener("click", enviarPedidoWhatsApp);
    document.getElementById("btn-vaciar-carrito").addEventListener("click", () => {
      if (confirm("¿Vaciar todo tu pedido?")) {
        guardarCarrito([]);
        renderizarCarrito();
      }
    });

    actualizarBadgeCarrito();

    cargarCatalogo();
  </script>

</body>

</html>
